<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Strands Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B10;
    --surface:#15151D;
    --surface-2:#1D1D27;
    --line: rgba(255,255,255,0.08);
    --text:#F5F3EE;
    --muted:#8D8D9A;
    --whatsapp:#25D366;
    --accent:#F2C94C;
    --accent-soft: rgba(242,201,76,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--accent-soft), transparent 60%),
      var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom: 84px;
  }
  ::selection{background:var(--accent); color:#000;}

  h1,h2,h3{font-family:'Bebas Neue',sans-serif; letter-spacing:0.02em; margin:0;}

  .wrap{max-width:520px; margin:0 auto; padding:18px 16px 0;}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 2px 14px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:34px; height:34px; border-radius:9px;
    background:var(--accent); color:#0B0B10; font-family:'Bebas Neue';
    display:flex; align-items:center; justify-content:center; font-size:19px;
    flex-shrink:0;
  }
  .brand .txt{line-height:1.05;}
  .brand .txt .eyebrow{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.14em; color:var(--muted); text-transform:uppercase;}
  .brand .txt .title{font-size:22px;}
  .loc-pill{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.05em;
    border:1px solid var(--line); color:var(--muted); padding:5px 10px; border-radius:100px;
    white-space:nowrap;
  }
  .loc-pill b{color:var(--text); font-weight:700;}

  .btn-back{
    display:block; width:100%; margin-bottom:14px;
    background:var(--accent); color:#0B0B10; border:none; border-radius:14px;
    padding:18px 16px; font-family:'Bebas Neue'; font-size:22px; letter-spacing:0.02em;
    cursor:pointer; text-align:center;
    box-shadow:0 8px 22px rgba(0,0,0,0.35);
  }
  .btn-back:active{transform:scale(0.98);}

  .progress-strip{
    display:flex; align-items:center; gap:8px; margin-bottom:16px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px;
  }
  .progress-strip .label{font-family:'Space Mono',monospace; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; flex-shrink:0;}
  .dots{display:flex; gap:6px; flex:1;}
  .dot{
    flex:1; height:8px; border-radius:5px; background:rgba(255,255,255,0.08);
    position:relative; overflow:hidden;
  }
  .dot.solved{background:#22C55E;}
  .dot.gaveup{background:#5b5b66;}
  .dot.current{outline:2px solid var(--accent); outline-offset:1px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:16px; margin-bottom:16px;
  }

  .hero{padding:28px 4px 8px;}
  .hero .eyebrow{font-family:'Space Mono',monospace; color:var(--accent); font-size:12px; letter-spacing:0.16em; text-transform:uppercase;}
  .hero h1{font-size:46px; line-height:0.95; margin-top:6px;}
  .hero p{color:var(--muted); font-size:15px; line-height:1.5; margin-top:10px; max-width:40ch;}

  .stall-grid{display:grid; grid-template-columns:1fr; gap:12px; margin-top:20px;}

  .stall-card{
    display:block; text-decoration:none; color:inherit; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px;
    position:relative; overflow:hidden;
  }
  .stall-card::before{
    content:""; position:absolute; inset:0; opacity:0.10; background:var(--c);
  }
  .stall-card .n{font-family:'Space Mono',monospace; font-size:11px; color:var(--muted);}
  .stall-card .g{font-family:'Bebas Neue'; font-size:22px; margin-top:2px; position:relative;}
  .stall-card .l{font-size:12px; color:var(--muted); margin-top:4px; position:relative;}
  .stall-card .badge{
    position:absolute; top:10px; right:10px; font-size:16px;
  }
  .stall-card.locked{cursor:default; opacity:0.55;}
  .stall-card.locked::before{opacity:0.04;}
  .stall-card.locked .g{color:var(--muted);}
  .stall-card.locked .l{display:flex; align-items:center; gap:4px;}

  .toast-host{
    position:absolute; left:50%; top:-6px; transform:translate(-50%,-100%);
    z-index:5; width:calc(100% - 8px); pointer-events:none;
  }
  .toast{
    background:#1D1D27; border:1px solid var(--line); color:var(--text);
    font-size:12.5px; line-height:1.4; padding:9px 12px; border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    opacity:0; transform:translateY(6px); transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast b{color:var(--accent);}

  .puzzle-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px;}
  .puzzle-head h2{font-size:28px;}
  .found-count{font-family:'Space Mono',monospace; font-size:13px; color:var(--muted);}
  .found-count b{color:var(--accent);}
  .hint-line{color:var(--muted); font-size:13px; margin:4px 0 14px;}

  .grid-shell{position:relative; touch-action:none; user-select:none;}
  .grid{
    display:grid; gap:6px;
    position:relative; z-index:2;
  }
  .cell{
    aspect-ratio:1/1; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:20px;
    background:var(--surface-2); color:var(--text);
    border:1px solid var(--line);
    transition:transform .12s ease, background .12s ease, color .12s ease, border-color .12s ease;
  }
  .cell.active{background:var(--accent); color:#0B0B10; border-color:var(--accent); transform:scale(1.08);}
  .cell.found{color:#0B0B10; border-color:transparent;}
  .cell.just-found{animation:pop .35s ease;}
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.22);} 100%{transform:scale(1);} }
  .grid-shell.shake .grid{animation:shake .3s ease;}
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  svg.threads{position:absolute; inset:0; z-index:1; pointer-events:none; overflow:visible;}
  svg.threads path{fill:none; stroke-linecap:round; stroke-linejoin:round;}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
  .chip{
    font-family:'Space Mono',monospace; font-size:12px; padding:6px 10px; border-radius:100px;
    background:var(--surface-2); color:var(--muted); border:1px solid var(--line);
    letter-spacing:0.03em;
  }
  .chip.found{color:#0B0B10; border-color:transparent; font-weight:700;}

  .actions{display:flex; gap:10px; margin-top:18px;}
  .btn{
    flex:1; border:none; border-radius:12px; padding:13px 14px; font-family:'Inter';
    font-weight:700; font-size:14px; cursor:pointer; text-align:center; text-decoration:none;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--muted);}
  .btn-ghost:active{background:var(--surface-2);}
  .btn-primary{background:var(--accent); color:#0B0B10;}

  .wa-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:linear-gradient(180deg, rgba(11,11,16,0), var(--ink) 22%);
    padding:14px 16px 16px;
    display:flex; justify-content:center;
    transform:translateY(120%); transition:transform .35s ease;
  }
  .wa-bar.show{transform:translateY(0);}
  .wa-inner{
    width:100%; max-width:488px; background:var(--whatsapp); border-radius:14px;
    padding:12px 16px; display:flex; align-items:center; gap:12px; text-decoration:none; color:#06210f;
    box-shadow:0 10px 30px rgba(37,211,102,0.25);
  }
  .wa-inner svg{flex-shrink:0;}
  .wa-inner .t{line-height:1.15;}
  .wa-inner .t .a{font-weight:800; font-size:14px;}
  .wa-inner .t .b{font-size:11.5px; opacity:0.85;}
  .wa-inner .go{margin-left:auto; font-size:20px;}

  .overlay{
    position:fixed; inset:0; background:rgba(6,6,9,0.72); backdrop-filter: blur(4px);
    display:flex; align-items:flex-end; justify-content:center; z-index:100;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .modal{
    width:100%; max-width:520px; background:var(--surface); border:1px solid var(--line);
    border-radius:22px 22px 0 0; padding:26px 22px 26px; text-align:center;
    transform:translateY(30px); transition:transform .3s ease;
  }
  .overlay.show .modal{transform:translateY(0);}
  .modal .icon{font-size:44px; margin-bottom:6px;}
  .modal h3{font-size:30px;}
  .modal p{color:var(--muted); font-size:14px; margin:8px 0 18px; line-height:1.5;}
  .modal .btn{width:100%;}

  .footer-note{
    text-align:center; color:var(--muted); font-family:'Space Mono',monospace;
    font-size:10.5px; letter-spacing:0.04em; padding:22px 16px 10px; opacity:0.6;
  }
  .reset-link{color:var(--muted); text-decoration:underline; background:none; border:none; font-family:inherit; font-size:inherit; cursor:pointer; padding:0;}
  .beta-banner{
    display:flex; align-items:center; gap:8px; background:rgba(139,92,246,0.14);
    border:1px solid rgba(139,92,246,0.4); color:#C4B5FD; border-radius:12px;
    padding:9px 12px; font-size:12px; margin-bottom:14px;
  }
  .beta-banner b{color:#fff;}
  .footer-note .sep{opacity:0.4; margin:0 6px;}
</style>
</head>

</div>

  <div class="modal" id="modalBody"></div>
</div>
